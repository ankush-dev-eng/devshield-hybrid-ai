<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <!-- Color Gradients -->
    <linearGradient id="shield-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1229" />
      <stop offset="50%" stop-color="#040817" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>

    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5df0a8" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="facet-top" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>

    <linearGradient id="core-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5df0a8" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="circuit-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5df0a8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Ambient Backdrop Halo -->
  <circle cx="256" cy="240" r="180" fill="url(#core-glow)" opacity="0.15" filter="url(#neon-glow)" />

  <!-- Master Shield Group -->
  <g filter="url(#subtle-shadow)">
    <!-- Outer Shield Outer Rim -->
    <path d="M 256,44 
             L 424,108 
             C 424,284 356,396 256,468 
             C 156,396 88,284 88,108 
             Z" 
          fill="url(#shield-body)" 
          stroke="url(#border-glow)" 
          stroke-width="5" 
          stroke-linejoin="round" />

    <!-- Inner Shield Inset Layer -->
    <path d="M 256,68 
             L 402,124 
             C 402,274 342,374 256,438 
             C 170,374 110,274 110,124 
             Z" 
          fill="#030713" 
          stroke="rgba(255, 255, 255, 0.08)" 
          stroke-width="2" />

    <!-- Upper Specular Facet -->
    <path d="M 256,68 
             L 402,124 
             C 380,210 320,270 256,290 
             C 192,270 132,210 110,124 
             Z" 
          fill="url(#facet-top)" />

    <!-- Circuit Traces on Shield Body -->
    <g stroke="url(#border-glow)" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round">
      <path d="M 150,180 L 190,180 L 210,200" />
      <path d="M 362,180 L 322,180 L 302,200" />
      <path d="M 160,260 L 195,260 L 215,280" />
      <path d="M 352,260 L 317,260 L 297,280" />
      <path d="M 256,380 L 256,415" />
    </g>

    <!-- Circuit Connection Dots -->
    <circle cx="150" cy="180" r="3.5" fill="#5df0a8" />
    <circle cx="362" cy="180" r="3.5" fill="#38bdf8" />
    <circle cx="160" cy="260" r="3.5" fill="#5df0a8" />
    <circle cx="352" cy="260" r="3.5" fill="#38bdf8" />
    <circle cx="256" cy="380" r="4" fill="#38bdf8" />

    <!-- Left Code Armored Bracket "<" -->
    <path d="M 206,170 
             L 156,236 
             L 206,302" 
          fill="none" 
          stroke="url(#core-glow)" 
          stroke-width="14" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#neon-glow)" />

    <!-- Right Code Armored Bracket ">" -->
    <path d="M 306,170 
             L 356,236 
             L 306,302" 
          fill="none" 
          stroke="url(#core-glow)" 
          stroke-width="14" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#neon-glow)" />

    <!-- Central Neural AI Core Diamond -->
    <g transform="translate(256, 236)">
      <!-- Radar Pulse Ring -->
      <circle cx="0" cy="0" r="46" fill="none" stroke="rgba(93, 240, 168, 0.3)" stroke-width="1.5" stroke-dasharray="6 4" />
      <circle cx="0" cy="0" r="62" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" stroke-dasharray="8 6" />

      <!-- Diamond Core -->
      <polygon points="0,-36 36,0 0,36 -36,0" 
               fill="#040816" 
               stroke="url(#border-glow)" 
               stroke-width="4" 
               filter="url(#neon-glow)" />

      <!-- Air-Gapped Keyhole / Core Node -->
      <path d="M 0,-14 C -6,-14 -11,-9 -11,-3 C -11,2 -7,5 -4,6 L -7,18 L 7,18 L 4,6 C 7,5 11,2 11,-3 C 11,-9 6,-14 0,-14 Z" 
            fill="url(#core-glow)" />

      <!-- Center Spark -->
      <circle cx="0" cy="-3" r="3" fill="#ffffff" />
    </g>

    <!-- Top Crest Light Gem -->
    <polygon points="256,56 264,68 256,76 248,68" fill="#5df0a8" filter="url(#neon-glow)" />
  </g>
</svg>
